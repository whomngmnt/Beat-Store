# Local Postgres for development. The password is a local-only placeholder.
name: beatstore

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: beatstore
    ports:
      # Host port 5433: a native PostgreSQL already uses 5432 on this machine.
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d beatstore"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
