name: CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [main]

# The workflow only reads the repo.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Installs the pnpm version named in package.json "packageManager".
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Fails on any high or critical advisory in a dependency, e.g. a
      # vulnerable Next.js or Better Auth version. Advisories checked and
      # skipped on purpose are listed in pnpm-workspace.yaml (audit.ignore).
      - run: pnpm audit --audit-level=high
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
